<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="Shader Rendering">
  <defs>
    <linearGradient id="sdrBg" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ff9a5a" stop-opacity=".26"/>
      <stop offset="1" stop-color="#c050ff" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="sdrBall" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(38 37) rotate(58) scale(36)">
      <stop stop-color="#ffe6c2"/>
      <stop offset=".45" stop-color="#ffb070"/>
      <stop offset="1" stop-color="#7b3dff"/>
    </radialGradient>
    <linearGradient id="sdrLine" x1="26" y1="24" x2="72" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ffe0b8"/>
      <stop offset="1" stop-color="#d3a4ff"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="4" y="4" width="88" height="88" rx="24"
        fill="url(#sdrBg)" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>

  <!-- 球体 -->
  <circle cx="46" cy="46" r="22" fill="url(#sdrBall)" stroke="url(#sdrLine)" stroke-width="2"/>

  <!-- 经纬线（着色 / UV 感） -->
  <path d="M24 46h44" stroke="#ffffff" stroke-opacity=".26" stroke-width="1.2"/>
  <ellipse cx="46" cy="46" rx="22" ry="9"  stroke="#ffffff" stroke-opacity=".20" stroke-width="1.2"/>
  <ellipse cx="46" cy="46" rx="9"  ry="22" stroke="#ffffff" stroke-opacity=".20" stroke-width="1.2"/>

  <!-- 镜面高光 -->
  <circle cx="37" cy="37" r="4.6" fill="#ffffff" fill-opacity=".72"/>

  <!-- 三角网格（渲染管线暗示） -->
  <path d="M61 69l11-5.5v11z"
        fill="#ffffff" fill-opacity=".12"
        stroke="url(#sdrLine)" stroke-width="1.8" stroke-linejoin="round"/>
  <circle cx="61" cy="69"  r="1.6" fill="#ffe0b8"/>
  <circle cx="72" cy="63.5" r="1.6" fill="#ffe0b8"/>
  <circle cx="72" cy="74.5" r="1.6" fill="#ffe0b8"/>
</svg>