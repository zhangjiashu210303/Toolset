<svg xmlns="http://www.w3.org/2000/svg" width="96" height="96" viewBox="0 0 96 96" fill="none" role="img" aria-label="SHA 解密">
  <defs>
    <linearGradient id="shaBg" x1="6" y1="6" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop stop-color="#40b4ff" stop-opacity=".30"/>
      <stop offset="1" stop-color="#7b5aff" stop-opacity=".16"/>
    </linearGradient>
    <linearGradient id="shaLine" x1="28" y1="26" x2="72" y2="74" gradientUnits="userSpaceOnUse">
      <stop stop-color="#b0e0ff"/>
      <stop offset="1" stop-color="#c9a4ff"/>
    </linearGradient>
  </defs>

  <!-- 底板 -->
  <rect x="4" y="4" width="88" height="88" rx="24"
        fill="url(#shaBg)" stroke="#ffffff" stroke-opacity=".18" stroke-width="1.5"/>

  <!-- 锁梁 -->
  <path d="M38 46V37a10 10 0 0 1 20 0v9"
        stroke="url(#shaLine)" stroke-width="3.2" stroke-linecap="round" fill="none"/>

  <!-- 锁体 -->
  <rect x="30" y="45" width="36" height="28" rx="7"
        fill="#ffffff" fill-opacity=".10"
        stroke="url(#shaLine)" stroke-width="2.6"/>

  <!-- 锁体中的井号 -->
  <g stroke="url(#shaLine)" stroke-width="2.2" stroke-linecap="round">
    <path d="M40.5 54.5h13"/>
    <path d="M40.5 63.5h13"/>
    <path d="M44 50.5v17"/>
    <path d="M50 50.5v17"/>
  </g>
</svg>