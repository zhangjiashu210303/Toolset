<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工具集</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
    background:#0a0c0f;color:#eef2f6;overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  ::-webkit-scrollbar{width:8px;height:8px}
  ::-webkit-scrollbar-track{background:#101418}
  ::-webkit-scrollbar-thumb{background:#2e3a47;border-radius:20px}
  ::-webkit-scrollbar-thumb:hover{background:#3f5062}

  /* ===== 深空背景 ===== */
  .aurora-bg{
    position:fixed;inset:0;z-index:-2;filter:blur(40px);
    background:
      radial-gradient(circle at 20% 28%, rgba(64,180,255,.20), transparent 46%),
      radial-gradient(circle at 80% 68%, rgba(170,80,255,.22), transparent 52%),
      radial-gradient(circle at 42% 88%, rgba(0,255,200,.12), transparent 62%),
      #0a0c0f;
  }
  .grid-overlay{
    position:fixed;inset:0;z-index:-1;pointer-events:none;
    background-image:
      linear-gradient(rgba(255,255,255,.02) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,.02) 1px, transparent 1px);
    background-size:40px 40px;
    mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 85%);
    -webkit-mask-image:radial-gradient(ellipse at 50% 0%, #000 30%, transparent 85%);
  }

  /* ===== Hero ===== */
  .hero{
    position:fixed;top:0;left:0;width:100%;height:100vh;
    display:flex;flex-direction:column;justify-content:center;align-items:center;
    text-align:center;padding:2rem;z-index:10;
    transition:transform .75s cubic-bezier(.23,1,.32,1), opacity .5s;
    will-change:transform;
  }
  .hero.hidden{transform:translateY(-120vh);opacity:0;pointer-events:none}

  .hero h1{
    font-size:clamp(2.6rem, 9vw, 5.4rem);
    font-weight:700;letter-spacing:-.03em;margin-bottom:1rem;
    background:linear-gradient(120deg,#fff 0%,#b0e0ff 25%,#d0a0ff 50%,#b0e0ff 75%,#fff 100%);
    background-size:200% 100%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;
    text-shadow:0 0 40px rgba(64,180,255,.35);
    animation:shimmer 8s ease-in-out infinite;
  }
  @keyframes shimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

  .hero p{
    font-size:clamp(.95rem,2.2vw,1.2rem);
    color:#94a3b8;max-width:600px;line-height:1.7;margin-bottom:2.2rem;
  }
  .hero .hint{
    display:flex;align-items:center;gap:.55rem;color:#5f7d9c;
    font-size:.88rem;animation:pulse 2s infinite;
  }
  .hero .hint span{
    display:inline-block;width:8px;height:8px;border-radius:50%;
    background:#40b4ff;box-shadow:0 0 12px #40b4ff;
  }
  @keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

  /* ===== 列表滚动容器 ===== */
  .list-section{
    position:fixed;inset:0;z-index:20;
    overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;
    padding:0 0 5rem;
    transform:translateY(105%);
    transition:transform .75s cubic-bezier(.23,1,.32,1);
    will-change:transform;
  }
  .list-section.visible{transform:translateY(0)}

  .container{max-width:1240px;margin:0 auto;padding:0 1.5rem}

  /* ===== 吸顶工具栏 ===== */
  .list-header{
    position:sticky;top:0;z-index:20;
    padding:1rem 0;
    background:linear-gradient(180deg, rgba(10,12,15,.90), rgba(10,12,15,.62));
    -webkit-backdrop-filter:blur(20px) saturate(1.6);
    backdrop-filter:blur(20px) saturate(1.6);
    border-bottom:1px solid rgba(255,255,255,.07);
    box-shadow:0 8px 30px rgba(0,0,0,.28);
  }
  .toolbar{display:flex;flex-wrap:wrap;align-items:center;gap:1rem}

  .search-box{flex:1;min-width:220px;position:relative}
  .search-box::before{
    content:"🔍";position:absolute;left:1.15rem;top:50%;
    transform:translateY(-50%);font-size:1rem;opacity:.55;z-index:1;
  }
  .search-box input{
    width:100%;padding:.82rem 1.2rem .82rem 2.9rem;border-radius:60px;
    background:linear-gradient(135deg, rgba(255,255,255,.10), rgba(255,255,255,.03));
    -webkit-backdrop-filter:blur(22px) saturate(1.8);
    backdrop-filter:blur(22px) saturate(1.8);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 10px 30px rgba(0,0,0,.32);
    color:#eef2f6;font-size:.95rem;font-family:inherit;
    outline:none;transition:border-color .25s, box-shadow .25s, background .25s;
  }
  .search-box input::placeholder{color:#6b7f95}
  .search-box input:focus{
    border-color:rgba(64,180,255,.6);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.5), 0 0 0 4px rgba(64,180,255,.12), 0 14px 36px rgba(64,180,255,.16);
  }
  .search-box input::-webkit-search-cancel-button{-webkit-appearance:none}

  .toolbar-right{display:flex;align-items:center;gap:.7rem}
  .stat{
    font-size:.78rem;color:#8ea6bd;white-space:nowrap;
    padding:.5rem 1rem;border-radius:60px;
    background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.10);
    -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  }
  .icon-btn{
    width:40px;height:40px;flex-shrink:0;
    display:grid;place-items:center;
    border-radius:50%;cursor:pointer;font-size:1rem;color:#c3d4e5;
    background:linear-gradient(135deg, rgba(255,255,255,.09), rgba(255,255,255,.02));
    -webkit-backdrop-filter:blur(16px) saturate(1.6);
    backdrop-filter:blur(16px) saturate(1.6);
    border:1px solid rgba(255,255,255,.16);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.3), 0 8px 22px rgba(0,0,0,.3);
    transition:transform .25s cubic-bezier(.34,1.56,.64,1), background .25s, border-color .25s;
  }
  .icon-btn:hover{background:linear-gradient(135deg, rgba(255,255,255,.15), rgba(255,255,255,.04));border-color:rgba(64,180,255,.4)}
  .icon-btn:active{transform:scale(.92) translateY(1px);transition-duration:.08s}
  .icon-btn.spin{animation:spin .7s linear}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ===== 卡片网格 ===== */
  .card-grid{
    display:grid;
    grid-template-columns:repeat(auto-fill, minmax(205px, 1fr));
    gap:1.3rem;
    padding:1.6rem 0 2rem;
    perspective:1200px;
  }

  .card{
    position:relative;display:flex;flex-direction:column;
    overflow:hidden;text-decoration:none;color:inherit;
    border-radius:24px;
    background:linear-gradient(135deg, rgba(255,255,255,.10) 0%, rgba(255,255,255,.03) 50%, rgba(255,255,255,.07) 100%);
    -webkit-backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
    backdrop-filter:blur(26px) saturate(1.8) brightness(1.06);
    border:1px solid rgba(255,255,255,.15);
    box-shadow:
      0 24px 50px -20px rgba(0,0,0,.75),
      inset 0 1px 0 rgba(255,255,255,.42),
      inset 0 -1px 0 rgba(255,255,255,.08);
    /* 入场用独立的 translate / opacity，把 transform 留给 3D 倾斜 */
    opacity:0;
    translate:0 28px;
    transform:rotateX(0deg) rotateY(0deg);
    transition:
      opacity .55s cubic-bezier(.23,1,.32,1),
      translate .55s cubic-bezier(.23,1,.32,1),
      transform .3s cubic-bezier(.23,1,.32,1),
      box-shadow .35s, border-color .35s;
    transition-delay:var(--d,0ms), var(--d,0ms), 0ms, 0ms, 0ms;
  }
  .card.in{opacity:1;translate:0 0}
  .card:hover{
    border-color:rgba(64,180,255,.38);
    box-shadow:
      0 36px 72px -24px rgba(64,180,255,.30),
      inset 0 1px 0 rgba(255,255,255,.55),
      inset 0 -1px 0 rgba(255,255,255,.10);
  }
  .card:active{transform:rotateX(0deg) rotateY(0deg) scale(.985);transition-duration:.08s}

  .card::before{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    background:linear-gradient(180deg, rgba(255,255,255,.16) 0%, rgba(255,255,255,.03) 35%, transparent 70%);
  }
  .card::after{
    content:'';position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:1;
    background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), rgba(255,255,255,.16), transparent 42%);
    opacity:0;transition:opacity .4s;
  }
  .card:hover::after{opacity:1}

  /* 缩略图区 */
  .thumb{
    position:relative;aspect-ratio:16/10;
    display:grid;place-items:center;overflow:hidden;
    z-index:2;
  }
  .thumb .init{
    font-size:2.1rem;font-weight:700;letter-spacing:.02em;
    color:rgba(255,255,255,.9);text-shadow:0 2px 16px rgba(0,0,0,.35);
    user-select:none;transition:opacity .3s;
  }
  .thumb img{
    position:absolute;inset:0;width:100%;height:100%;
    object-fit:contain;padding:20px;
    opacity:0;transition:opacity .4s ease, transform .5s ease;
  }
  .thumb.has-img img{opacity:1}
  .thumb.has-img .init{opacity:0}
  .card:hover .thumb.has-img img{transform:scale(1.05)}

  /* 文字区 */
  .card-content{
    position:relative;z-index:2;
    padding:.95rem 1.1rem 1.1rem;
    display:flex;flex-direction:column;gap:.28rem;
  }
  .card-title{
    font-size:.98rem;font-weight:600;line-height:1.35;color:#fff;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-sub{
    display:flex;align-items:center;gap:.35rem;
    font-size:.75rem;color:#8ea6bd;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  }
  .card-sub .mark{
    width:5px;height:5px;border-radius:50%;flex-shrink:0;
    background:#40b4ff;box-shadow:0 0 8px rgba(64,180,255,.8);
  }
  .card.ext .card-sub .mark{background:#b48bff;box-shadow:0 0 8px rgba(180,139,255,.8)}
  .card-sub .txt{overflow:hidden;text-overflow:ellipsis}

  .card.disabled{cursor:default;opacity:.62}
  .card.disabled:hover{border-color:rgba(255,255,255,.15);box-shadow:0 24px 50px -20px rgba(0,0,0,.75), inset 0 1px 0 rgba(255,255,255,.42)}
  .card.disabled .mark{background:#5a6b7c;box-shadow:none}

  /* ===== 骨架屏 ===== */
  .sk{
    aspect-ratio:16/10.55;
    border-radius:24px;
    background:linear-gradient(100deg,#131a24 22%,#1d2733 42%,#131a24 62%);
    background-size:220% 100%;
    animation:shimmerBg 1.25s linear infinite;
    border:1px solid rgba(255,255,255,.06);
  }
  @keyframes shimmerBg{from{background-position:180% 0}to{background-position:-80% 0}}

  /* ===== 空状态 ===== */
  .empty{
    grid-column:1/-1;
    text-align:center;padding:5rem 1rem;color:#6d7f93;
  }
  .empty .ico{font-size:2.6rem;margin-bottom:.8rem;opacity:.75}
  .empty h3{font-size:1.05rem;font-weight:600;color:#c3d4e5;margin-bottom:.4rem}
  .empty p{font-size:.88rem;line-height:1.6}

  /* ===== Toast ===== */
  .toast{
    position:fixed;left:50%;bottom:2rem;z-index:300;
    transform:translateX(-50%) translateY(100px);
    padding:.85rem 1.7rem;border-radius:60px;
    background:rgba(20,30,40,.92);color:#eef2f6;
    -webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);
    border:1px solid rgba(255,255,255,.14);
    box-shadow:0 24px 50px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.22);
    font-size:.88rem;opacity:0;pointer-events:none;
    transition:transform .4s cubic-bezier(.23,1,.32,1), opacity .4s;
    max-width:88vw;text-align:center;
  }
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}

  @media(max-width:560px){
    .card-grid{grid-template-columns:repeat(auto-fill, minmax(148px,1fr));gap:.9rem;padding:1.1rem 0 2rem}
    .container{padding:0 1rem}
    .list-header{padding:.8rem 0}
    .thumb img{padding:14px}
    .card-title{font-size:.9rem}
    .card-sub{font-size:.7rem}
    .card-content{padding:.8rem .9rem .9rem}
  }

  @media(prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;animation-iteration-count:1 !important;transition-duration:.01ms !important}
  }
</style>
</head>
<body>
<div class="aurora-bg"></div>
<div class="grid-overlay"></div>

<!-- ===== Hero ===== -->
<section class="hero" id="hero">
  <h1>工具集</h1>
  <p>常用小工具 · 点开即用 · 一触即达</p>
  <div class="hint"><span></span>向下滚动，浏览全部工具</div>
</section>

<!-- ===== 列表 ===== -->
<main class="list-section" id="listSection">
  <div class="list-header">
    <div class="container">
      <div class="toolbar">
        <div class="search-box">
          <input type="text" id="searchInput" placeholder="搜索工具名称…" autocomplete="off" spellcheck="false">
        </div>
        <div class="toolbar-right">
          <span class="stat" id="stat">加载中…</span>
          <button class="icon-btn" id="reloadBtn" title="重新加载">⟳</button>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="card-grid" id="cardGrid"></div>
  </div>
</main>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  /* ================= 元素 ================= */
  const hero        = document.getElementById('hero');
  const listSection = document.getElementById('listSection');
  const grid        = document.getElementById('cardGrid');
  const stat        = document.getElementById('stat');
  const searchInput = document.getElementById('searchInput');
  const reloadBtn   = document.getElementById('reloadBtn');
  const toastEl     = document.getElementById('toast');

  /* ================= 兜底数据（assets.json 读取失败时展示） ================= */
  const FALLBACK = [
    { name: 'JSON 格式化',   image: './images/json.svg',   link: './tools/json/' },
    { name: '时间戳转换',    image: './images/time.svg',   link: './tools/timestamp/' },
    { name: 'Base64 编解码', image: './images/base64.svg', link: './tools/base64/' },
    { name: '颜色转换器',    image: './images/color.svg',  link: './tools/color/' },
    { name: '正则测试',      image: './images/regex.svg',  link: './tools/regex/' },
    { name: 'GitHub',        image: 'https://github.com/favicon.ico', link: 'https://github.com' },
    { name: 'MDN 文档',      image: 'https://developer.mozilla.org/favicon.ico', link: 'https://developer.mozilla.org' }
  ];

  /* ================= 状态 ================= */
  let ALL = [];
  let KEYWORD = '';
  let isListVisible = false;
  let isAnimating = false;
  const SWITCH_MS = 780;
  const TOUCH_THRESHOLD = 10;

  /* ================= 工具函数 ================= */
  function showToast(msg, duration) {
    duration = duration || 2800;
    toastEl.textContent = msg;
    toastEl.classList.add('show');
    clearTimeout(window.__tt);
    window.__tt = setTimeout(function () { toastEl.classList.remove('show'); }, duration);
  }

  function escapeHtml(s) {
    if (s === null || s === undefined) return '';
    return String(s).replace(/[&<>"']/g, function (m) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
    });
  }

  /* http(s)://  mailto:  tel:  //host  等视为外链 */
  function isExternal(link) {
    return /^(?:[a-z][a-z0-9+.-]*:|\/\/)/i.test(link);
  }

  function safeLink(link) {
    var l = String(link || '').trim();
    if (!l) return '';
    if (/^\s*javascript:/i.test(l)) return '';   // 屏蔽危险协议
    return l;
  }

  function hostOf(link) {
    try {
      var u = new URL(link, location.href);
      return u.host || u.protocol.replace(':', '');
    } catch (e) {
      return '';
    }
  }

  /* 由名称生成稳定的色相，用于缩略图占位背景 */
  function hueOf(str) {
    var h = 0;
    var s = String(str || '');
    for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) % 360;
    return h;
  }

  /* ================= 卡片 ================= */
  function makeCard(item, index) {
    var name  = String(item.name == null ? '' : item.name).trim() || '未命名工具';
    var link  = safeLink(item.link);
    var image = String(item.image || item.img || '').trim();

    var a = document.createElement('a');
    a.className = 'card';
    a.style.setProperty('--d', Math.min(index, 16) * 35 + 'ms');

    /* --- 缩略图 --- */
    var thumb = document.createElement('div');
    thumb.className = 'thumb';
    var h = hueOf(name);
    thumb.style.background =
      'linear-gradient(140deg, hsl(' + h + ' 55% 26%), hsl(' + ((h + 45) % 360) + ' 60% 15%))';

    var init = document.createElement('span');
    init.className = 'init';
    var chars = Array.from(name);
    init.textContent = chars.length ? chars[0].toUpperCase() : '?';
    thumb.appendChild(init);

    if (image) {
      var img = new Image();
      img.alt = name;
      img.loading = 'lazy';
      img.decoding = 'async';
      img.addEventListener('load', function () { thumb.classList.add('has-img'); });
      img.addEventListener('error', function () { img.remove(); });
      img.src = image;
      thumb.appendChild(img);
    }

    /* --- 文字 --- */
    var content = document.createElement('div');
    content.className = 'card-content';

    var title = document.createElement('h3');
    title.className = 'card-title';
    title.textContent = name;
    title.title = name;

    var sub = document.createElement('div');
    sub.className = 'card-sub';

    var mark = document.createElement('span');
    mark.className = 'mark';
    var txt = document.createElement('span');
    txt.className = 'txt';

    /* --- 链接 --- */
    if (link) {
      a.setAttribute('href', link);
      if (isExternal(link)) {
        a.classList.add('ext');
        a.setAttribute('target', '_blank');
        a.setAttribute('rel', 'noopener noreferrer');
        txt.textContent = hostOf(link) || '外部链接';
      } else {
        // ./xxx 相对路径：按当前页面地址解析，GitHub Pages 同目录可直接访问
        txt.textContent = '本站工具';
      }
    } else {
      a.classList.add('disabled');
      a.removeAttribute('href');
      txt.textContent = '暂无链接';
    }

    sub.appendChild(mark);
    sub.appendChild(txt);
    content.appendChild(title);
    content.appendChild(sub);
    a.appendChild(thumb);
    a.appendChild(content);

    /* --- 3D 倾斜 + 动态高光（仅鼠标） --- */
    var raf = null;
    a.addEventListener('pointermove', function (e) {
      if (e.pointerType && e.pointerType !== 'mouse') return;
      if (raf) return;
      raf = requestAnimationFrame(function () {
        var rect = a.getBoundingClientRect();
        var x = e.clientX - rect.left;
        var y = e.clientY - rect.top;
        var rx = ((y - rect.height / 2) / (rect.height / 2)) * -4;
        var ry = ((x - rect.width / 2) / (rect.width / 2)) * 4;
        a.style.transform = 'rotateX(' + rx + 'deg) rotateY(' + ry + 'deg) translateY(-4px)';
        a.style.setProperty('--mx', x + 'px');
        a.style.setProperty('--my', y + 'px');
        raf = null;
      });
    });
    a.addEventListener('pointerleave', function () {
      a.style.transform = 'rotateX(0deg) rotateY(0deg)';
    });

    return a;
  }

  /* ================= 渲染 ================= */
  function render() {
    var kw = KEYWORD.trim().toLowerCase();
    var list = kw
      ? ALL.filter(function (it) { return String(it.name == null ? '' : it.name).toLowerCase().indexOf(kw) !== -1; })
      : ALL;

    grid.innerHTML = '';

    if (!list.length) {
      var box = document.createElement('div');
      box.className = 'empty';
      box.innerHTML = kw
        ? '<div class="ico">🔍</div><h3>没有找到匹配的工具</h3><p>换个关键词试试</p>'
        : '<div class="ico">🧰</div><h3>暂无工具</h3><p>请在 assets.json 中添加内容</p>';
      grid.appendChild(box);
    } else {
      var frag = document.createDocumentFragment();
      list.forEach(function (item, i) { frag.appendChild(makeCard(item, i)); });
      grid.appendChild(frag);

      // 下一帧触发入场动画
      requestAnimationFrame(function () {
        grid.querySelectorAll('.card').forEach(function (c) { c.classList.add('in'); });
      });
    }

    stat.textContent = kw
      ? '找到 ' + list.length + ' / ' + ALL.length
      : '共 ' + ALL.length + ' 个工具';
  }

  /* ================= 骨架屏 ================= */
  function showSkeleton() {
    grid.innerHTML = '';
    for (var i = 0; i < 8; i++) {
      var d = document.createElement('div');
      d.className = 'sk';
      grid.appendChild(d);
    }
    stat.textContent = '加载中…';
  }

  /* ================= 读取 assets.json ================= */
  function loadAssets() {
    showSkeleton();

    var url = new URL('./assets.json', location.href).href;

    return fetch(url, { cache: 'no-cache' })
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.json();
      })
      .then(function (data) {
        var list = null;
        if (Array.isArray(data)) list = data;
        else if (data && Array.isArray(data.items)) list = data.items;
        else if (data && Array.isArray(data.tools)) list = data.tools;
        else if (data && Array.isArray(data.list)) list = data.list;

        if (!list || !list.length) throw new Error('assets.json 为空或格式不正确');

        ALL = list.filter(function (x) { return x && typeof x === 'object'; });
        render();
        return { ok: true };
      })
      .catch(function (err) {
        console.warn('[工具集] 读取 assets.json 失败，已启用内置兜底数据：', err);
        ALL = FALLBACK.slice();
        render();
        return { ok: false, error: err.message };
      });
  }

  /* ================= 搜索 ================= */
  var timer = null;
  searchInput.addEventListener('input', function (e) {
    clearTimeout(timer);
    var val = e.target.value;
    timer = setTimeout(function () { KEYWORD = val; render(); }, 110);
  });

  /* 按 / 聚焦搜索 */
  document.addEventListener('keydown', function (e) {
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      if (!isListVisible) enterList();
      setTimeout(function () { searchInput.focus(); searchInput.select(); }, 60);
    }
    if (e.key === 'Escape' && isListVisible) exitList();
  });

  /* ================= 刷新 ================= */
  reloadBtn.addEventListener('click', function () {
    reloadBtn.classList.add('spin');
    setTimeout(function () { reloadBtn.classList.remove('spin'); }, 700);
    KEYWORD = '';
    searchInput.value = '';
    loadAssets().then(function (r) {
      if (!r.ok) showToast('⚠️ 加载失败：' + r.error + '（已显示内置示例）', 4200);
      else showToast('✅ 已加载 ' + ALL.length + ' 个工具');
    });
  });

  /* ================= 滚动切换 ================= */
  function enterList() {
    if (isAnimating || isListVisible) return;
    isAnimating = true;
    isListVisible = true;
    hero.classList.add('hidden');
    listSection.classList.add('visible');
    listSection.scrollTop = 0;
    setTimeout(function () { isAnimating = false; }, SWITCH_MS);
  }

  function exitList() {
    if (isAnimating || !isListVisible) return;
    isAnimating = true;
    isListVisible = false;
    hero.classList.remove('hidden');
    listSection.classList.remove('visible');
    listSection.scrollTop = 0;
    setTimeout(function () { isAnimating = false; }, SWITCH_MS);
  }

  window.addEventListener('wheel', function (e) {
    if (isAnimating) return;
    var dy = e.deltaY;
    if (Math.abs(dy) < 1) return;

    if (!isListVisible) {
      if (dy > 0) enterList();
    } else {
      if (listSection.scrollTop <= 0 && dy < 0) exitList();
    }
  }, { passive: true });

  var touchStartY = 0;
  window.addEventListener('touchstart', function (e) {
    if (isAnimating) return;
    touchStartY = e.touches[0].clientY;
  }, { passive: true });

  window.addEventListener('touchmove', function (e) {
    if (isAnimating) return;
    var dy = e.touches[0].clientY - touchStartY;
    if (!isListVisible) {
      if (dy < -TOUCH_THRESHOLD) enterList();
    } else {
      if (listSection.scrollTop <= 0 && dy > TOUCH_THRESHOLD) exitList();
    }
  }, { passive: true });

  /* ================= 启动 ================= */
  loadAssets().then(function (r) {
    if (!r.ok) {
      showToast('⚠️ assets.json 读取失败，已显示内置示例', 4200);
    }
  });
})();
</script>
</body>
</html>
